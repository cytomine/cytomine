plugins {
    id 'java'
    id 'checkstyle'
}

group = 'org.cytomine'
version = '1.0.0'
description = 'Keycloak custom roles mapper'

java {
    sourceCompatibility = '17'
}

checkstyle {
    toolVersion = '10.21.2'
    configFile = file("${rootProject.projectDir}/checkstyle.xml")
}

jar {
    archiveFileName = 'cytomine-protocol-mapper.jar'
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'org.keycloak:keycloak-core:24.0.2'
    compileOnly 'org.keycloak:keycloak-services:24.0.2'
    compileOnly 'org.keycloak:keycloak-server-spi:24.0.2'
    compileOnly 'org.keycloak:keycloak-server-spi-private:24.0.2'
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}
