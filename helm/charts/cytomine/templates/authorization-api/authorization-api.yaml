apiVersion: apps/v1
kind: Deployment
metadata:
  name: authorization-api
  annotations:
    kube-score/ignore: pod-probes,container-security-context-user-group-id
  labels:
    role: authorization-api
    app: authorization-api
    component: {{ .Release.Name }}-authorization-api
    release: {{ .Release.Name }}
spec:
  progressDeadlineSeconds: 1200
  replicas: 1
  selector:
    matchLabels:
      app: authorization-api
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        role: authorization-api
        app: authorization-api
        release: {{ .Release.Name }}
    spec:
      securityContext:
      {{- include "cytomine.podSecurityContext" . | nindent 8 }}
      {{- with .Values.global.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      - name: temp
        emptyDir: {}
      initContainers:
        - name: authorization-api-init
          image: "{{ .Values.images.authorization_api }}"
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext:
          {{- include "cytomine.containerSecurityContext" . | nindent 12 }}
          command:
            - /bin/sh
            - -c
            - |
              set -x
              cp -r /app/* /fix/
          volumeMounts:
            - name: temp
              mountPath: /fix
          resources:
            {{- toYaml .Values.authorization-api.resources | nindent 12 }}
      containers:
        - name: authorization-api
          image: "{{ .Values.images.authorization_api }}"
          securityContext:
          {{- include "cytomine.containerSecurityContext" . | nindent 12 }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - name: IAM_URL
              value: http://iam.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.iam.port }}
            - name: IAM_EXTERNAL_URL
              value: {{ include "core.url" . }}
            - name: APP_URL
              value: {{ include "core.url" . }}

          volumeMounts:
            - name: temp
              mountPath: /tmp
            - name: temp
              mountPath: /app
          ports:
            - name: http
              containerPort: {{ .Values.authorization_api.port }}
          resources:
            {{- toYaml .Values.authorization_api.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /ping
              port: {{ .Values.authorization_api.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /ping
              port: {{ .Values.authorization_api.port }}
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ping
              port: {{ .Values.authorization_api.port }}
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
      {{- with .Values.global.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
