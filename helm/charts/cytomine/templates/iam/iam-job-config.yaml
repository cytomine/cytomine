apiVersion: batch/v1
kind: Job
metadata:
  name: iam-config
  labels:
    app: iam-config
  annotations:
    "helm.sh/hook": post-install,post-upgrade
spec:
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      serviceAccountName: {{ include "cytomine.serviceAccountName" . }}
      securityContext:
      {{- include "cytomine.podSecurityContext" . | nindent 8 }}
      initContainers: # initContainers run in sequence, not containers
      - name: wait-for-iam-login
        image: "{{ .Values.images.iam }}"
        command: ["/bin/sh", "-c"]
        args:
          - |
            until /opt/keycloak/bin/kcadm.sh config credentials --server {{ include "cytomine.iamInternalUrl" . }} --realm master --user admin --password $KEYCLOAK_ADMIN_PASSWORD --config /opt/keycloak-auth/kcadm.config; do
              echo "Waiting for IAM to be ready..."
              sleep 5
            done
            echo "IAM is ready"
        volumeMounts:
        - name: kc-auth
          mountPath: "/opt/keycloak-auth"
        env:
        - name: KEYCLOAK_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: admin-iam-secret
              key: password
        securityContext:
        {{- include "cytomine.containerSecurityContext" . | nindent 10 }}

      - name: wait-for-repository
        image: "{{ .Values.images.curl }}"
        command: ["/bin/sh", "-c"]
        args: ["until curl -sf http://repository.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.repository.port }}/ping; do echo \"Waiting for repository to be ready...\"; sleep 5; done; echo \"Repository is ready\""]
        securityContext:
        {{- include "cytomine.containerSecurityContext" . | nindent 10 }}

{{ if and (.Values.iam.lsaaiClientIdSecretName) (and .Values.iam.lsaaiClientSecretSecretName .Values.iam.lsaaiEndpoint) }}
      # https://stackoverflow.com/a/75794013
      - name: fetch-auth-config
        image: {{ .Values.images.curl }}
        command: ["/bin/sh", "-c"]
        args: ["cat /opt/keycloak-auth/kcadm.config | grep token | sed -E 's/(token)|\"|:| |,//g' > /opt/keycloak-auth/token"]
        volumeMounts:
        - name: kc-auth
          mountPath: "/opt/keycloak-auth"
        securityContext:
        {{- include "cytomine.containerSecurityContext" . | nindent 10 }}

      - name: import-lsaai-config
        image: {{ .Values.images.curl }}
        command: ["/bin/sh", "-c"]
        args: ["AUTH=$(cat /opt/keycloak-auth/token) && curl -s -X POST -H \"Authorization: bearer $AUTH\" -H 'content-type: application/json' {{ include "cytomine.iamInternalUrl" . }}/admin/realms/cytomine/identity-provider/import-config -d '{\"fromUrl\":\"'{{ .Values.iam.lsaaiEndpoint }}'\",\"providerId\":\"oidc\"}' > /opt/keycloak-auth/import-config.json && cat /opt/keycloak-auth/import-config.json"]
        volumeMounts:
        - name: kc-auth
          mountPath: "/opt/keycloak-auth"
        securityContext:
        {{- include "cytomine.containerSecurityContext" . | nindent 10 }}


      - name: add-provider-lsaai-instance
        image: "{{ .Values.images.iam }}"
        command: ["/bin/sh", "-c"]
        args: ["JSON=$(cat /opt/keycloak-auth/import-config.json) && /opt/keycloak/bin/kcadm.sh create identity-provider/instances -r cytomine --server {{ include "cytomine.iamInternalUrl" . }} --config /opt/keycloak-auth/kcadm.config -s providerId=oidc -s alias=oidc -s enabled=true -s displayName='Life Science' -s config=$JSON -s config.clientId=$(LSAAI_CLIENT_ID) -s config.clientSecret=$(LSAAI_CLIENT_SECRET) -s config.backchannelSupported='true' || true"]
        volumeMounts:
        - name: kc-auth
          mountPath: "/opt/keycloak-auth"
        securityContext:
        {{- include "cytomine.containerSecurityContext" . | nindent 10 }}
        env:
        - name: LSAAI_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ .Values.iam.lsaaiClientSecretSecretName }}
              key: clientSecret
        - name: LSAAI_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: {{ .Values.iam.lsaaiClientIdSecretName }}
              key: clientId

      - name: add-provider-lsaai-mapper
        image: "{{ .Values.images.iam }}"
        command: ["/bin/sh", "-c"]
        args: ["/opt/keycloak/bin/kcadm.sh create identity-provider/instances/oidc/mappers -r cytomine --server {{ include "cytomine.iamInternalUrl" . }} --config /opt/keycloak-auth/kcadm.config -s identityProviderAlias=oidc -s identityProviderMapper=oidc-hardcoded-role-idp-mapper -s name=oidc-mapper -s config.role=core.ADMIN -s config.syncMode=INHERIT || true"]
        volumeMounts:
        - name: kc-auth
          mountPath: "/opt/keycloak-auth"
        securityContext:
        {{- include "cytomine.containerSecurityContext" . | nindent 10 }}
{{ end }}

{{ if and .Values.iam.lti.enabled (gt (len .Values.iam.lti.platforms) 0) }}
      # LTI 1.3 provisioning (admin guide step B): the public client the LMS platforms launch into.
      # Requires a Keycloak image that ships the `lti-identity-provider` SPI (see values.yaml iam.lti).
      - name: add-lti-tool-client
        image: "{{ .Values.images.iam }}"
        command: ["/bin/sh", "-c"]
        args:
          - |
            /opt/keycloak/bin/kcadm.sh create clients -r cytomine --server {{ include "cytomine.iamInternalUrl" . }} --config /opt/keycloak-auth/kcadm.config -s clientId={{ .Values.iam.lti.toolClientId }} -s publicClient=true -s standardFlowEnabled=true -s 'redirectUris={{ .Values.iam.lti.toolRedirectUris | toJson }}' || true
        volumeMounts:
        - name: kc-auth
          mountPath: "/opt/keycloak-auth"
        securityContext:
        {{- include "cytomine.containerSecurityContext" . | nindent 10 }}
{{ range .Values.iam.lti.platforms }}
      # LTI 1.3 provisioning (admin guide step C) for platform "{{ .alias }}": relies on the realm and
      # the Cytomine `core` client (role mapper target) being provisioned beforehand.
      - name: add-provider-lti-{{ .alias }}-instance
        image: "{{ $.Values.images.iam }}"
        command: ["/bin/sh", "-c"]
        args: ["/opt/keycloak/bin/kcadm.sh create identity-provider/instances -r cytomine --server {{ include "cytomine.iamInternalUrl" $ }} --config /opt/keycloak-auth/kcadm.config -s providerId=lti-1p3 -s alias={{ .alias }} -s enabled=true -s displayName='LTI 1.3 - {{ .alias }}' -s config.platformIssuer='{{ .issuer }}' -s config.toolClientId={{ $.Values.iam.lti.toolClientId }} -s config.keycloakClientId={{ $.Values.iam.lti.toolClientId }} -s config.allowedDeploymentIds='{{ .deploymentId }}' -s config.platformAuthorizationEndpoint='{{ .authorizationEndpoint }}' -s config.platformJwksUrl='{{ .jwksUrl }}' -s config.contentSelectionUrl='{{ .contentSelectionUrl }}' || true"]
        volumeMounts:
        - name: kc-auth
          mountPath: "/opt/keycloak-auth"
        securityContext:
        {{- include "cytomine.containerSecurityContext" $ | nindent 10 }}

      - name: add-provider-lti-{{ .alias }}-mappers
        image: "{{ $.Values.images.iam }}"
        command: ["/bin/sh", "-c"]
        args:
          - |
            /opt/keycloak/bin/kcadm.sh create identity-provider/instances/{{ .alias }}/mappers -r cytomine --server {{ include "cytomine.iamInternalUrl" $ }} --config /opt/keycloak-auth/kcadm.config -s identityProviderAlias={{ .alias }} -s identityProviderMapper=lti-core-role-mapper -s name=lti-core-roles || true
            /opt/keycloak/bin/kcadm.sh create identity-provider/instances/{{ .alias }}/mappers -r cytomine --server {{ include "cytomine.iamInternalUrl" $ }} --config /opt/keycloak-auth/kcadm.config -s identityProviderAlias={{ .alias }} -s identityProviderMapper=lti-project-membership-mapper -s name=lti-project-membership || true
        volumeMounts:
        - name: kc-auth
          mountPath: "/opt/keycloak-auth"
        securityContext:
        {{- include "cytomine.containerSecurityContext" $ | nindent 10 }}
{{ end }}
{{ end }}

      containers:
      - name: check-job-done
        image: "{{ .Values.images.iam }}"
        securityContext:
        {{- include "cytomine.containerSecurityContext" . | nindent 10 }}
        command: ["/bin/sh", "-c"]
        args: ["/opt/keycloak/bin/kcadm.sh config credentials --server {{ include "cytomine.iamInternalUrl" . }} --realm cytomine --user admin --password $(CYTOMINE_USER) --config /opt/keycloak-auth/kcadm.config"]
        env:
        - name: CYTOMINE_USER
          valueFrom:
            secretKeyRef:
              name: cytomine-admin-iam-secret
              key: password
        volumeMounts:
        - name: kc-auth
          mountPath: "/opt/keycloak-auth"
      volumes:
      - emptyDir: {}
        name: kc-auth
      restartPolicy: Never


